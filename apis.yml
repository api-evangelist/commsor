x-contract-discovery:
  date: '2026-08-04'
  result: none
  summary: >-
    No machine-readable API contract is published on any Commsor host. Every
    commsor.com subdomain probed (api., docs., developers., dev., go., app.)
    resolves to the Webflow wildcard CDN and is not a live API host. The
    application host dashboard.commsor.com (Vercel) answers every unknown path
    with a 200 SPA shell redirect to /signin, including /openapi.json,
    /swagger.json, /api-docs, /docs, /redoc, /graphql and /api/v1/openapi.json —
    none returns a parseable spec. A legacy REST API existed on the retired
    community-operations platform and was enabled per account on request via
    support@commsor.com; its documentation (the former Help Scout knowledge base)
    is gone and the current Pylon knowledge base carries four non-developer
    articles. No OpenAPI, no GraphQL SDL, no MCP server, no A2A agent card.
  probes:
  - {url: 'https://www.commsor.com/openapi.json', status: 404}
  - {url: 'https://dashboard.commsor.com/openapi.json', status: 200, note: SPA shell,
     redirect: /signin}
  - {url: 'https://dashboard.commsor.com/swagger.json', status: 200, note: SPA shell}
  - {url: 'https://dashboard.commsor.com/api/v1/openapi.json', status: 200, note: SPA
     shell}
  - {url: 'https://dashboard.commsor.com/graphql', status: 200, note: SPA shell}
  - {url: 'https://dashboard.commsor.com/api-docs', status: 200, note: SPA shell}
  - {url: 'https://www.commsor.com/.well-known/agent-card.json', status: 404}
  - {url: 'https://www.commsor.com/.well-known/agent.json', status: 404}
  - {url: 'https://dashboard.commsor.com/.well-known/agent-card.json', status: 404}
  - {url: 'https://support.commsor.com/llms.txt', status: 200, note: knowledge-base
     index, saved verbatim}
  legacy_api:
    documented: true
    access: 'request enablement via support@commsor.com (community-platform era)'
    docs_url: null
    docs_status: 'former support.commsor.com/article/38-integrating-with-commsors-api
      returns 404'
  reverified:
    date: '2026-08-13'
    result: none
    summary: >-
      Re-probed on 2026-08-13 with the same negative result. api., docs. and
      developers.commsor.com now refuse TCP entirely (CNAME to cdn.webflow.com,
      no Webflow site bound); dashboard.commsor.com (Next.js on Vercel) still
      answers /openapi.json, /api/openapi.json and /swagger.json with its SPA
      shell and 404s every /.well-known/ path including agent-card.json,
      agent.json, oauth-authorization-server and oauth-protected-resource. No
      OpenAPI, no GraphQL SDL, no MCP server, no A2A agent card.
  open_source_surface:
    note: >-
      NOT a Commsor product API — recorded so the finding is not lost, and
      deliberately NOT registered as an apis[] entry. The Commsor GitHub
      organization (https://github.com/commsor, profile links to commsor.com and
      X @commsor) hosts 11 public repositories, led by Titanoboa, an AGPL-3.0 JVM
      workflow-orchestration platform with 921 stars. Titanoboa carries a real,
      public, human-readable REST API reference in its GitHub wiki (Authentication,
      Job, Repository and Systems APIs, with request methods, paths and attribute
      tables) but publishes NO OpenAPI, Swagger, Postman collection or JSON Schema
      anywhere. The project is independently branded at titanoboa.io, was authored
      by Miro Kubicek, is published to Clojars under the personal account "miro",
      and its repository was transferred into this org (github.com/mikub/titanoboa
      301-redirects to github.com/commsor/titanoboa). It is a self-hosted engine
      with no vendor-operated base URL, is unrelated to the Go-to-Network product
      Commsor sells, and last shipped in 2022 — so it is attributed here as an
      open-source surface hosted by the company, not as a Commsor API.
    org: https://github.com/commsor
    repositories: 11
    api_documentation: https://github.com/commsor/titanoboa/wiki/API-Documentation
    api_documentation_status: 200
    machine_readable_spec: false
    last_repository_push: '2024-09-17'
