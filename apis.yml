aid: commsor
name: Commsor
description: 'Commsor is a go-to-network (GTN) platform for B2B revenue teams. It maps
  the collective relationship graph of a company''s employees, executives, investors,
  advisors, customers and community, then surfaces the warmest path into a target account
  so sellers and marketers can source pipeline through trusted introductions and referrals
  instead of cold outbound. The platform ingests relationship and engagement data from
  connected systems (HubSpot CRM, uploaded lists, and other connectors), scores network
  signals against company events, and routes intro requests to the person best placed
  to make them. Commsor previously operated a community-operations analytics platform
  and publishes a knowledge base, a Go-to-Network methodology curriculum (GTN University),
  guides and a blog. It does not currently publish a public developer portal, OpenAPI
  definition, or self-serve API documentation; a legacy REST API was enabled per-account
  on request during the community-platform era, and a Zapier app remains the documented
  programmatic write path. On 2026-07-23 The Swarm announced it is acquiring Commsor
  and winding down the Commsor products, folding selected features into The Swarm; no
  product sunset date has been published and the application and status page remain
  live.'
