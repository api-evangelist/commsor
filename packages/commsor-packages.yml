summary: >-
  Commsor publishes NO first-party client library for its Go-to-Network product.
  There is no Commsor SDK on npm, PyPI, RubyGems, Packagist, crates.io, NuGet,
  Maven Central or pkg.go.dev, and no SDK is referenced anywhere on the marketing
  site or in the Pylon knowledge base. The documented programmatic paths are the
  HubSpot connector, CSV list upload, and the Zapier app — none of which ships a
  package. No SDKs pointer is wired because no client library exists.
