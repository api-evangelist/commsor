open_source_artifacts:
  note: >-
    ATTRIBUTION CARE — these are NOT Commsor API client libraries and they do not
    wrap any Commsor product API. They are the published artifacts of Titanoboa, an
    AGPL-3.0 JVM workflow-orchestration platform whose repositories now live in the
    Commsor GitHub organization (https://github.com/commsor/titanoboa; the upstream
    path https://github.com/mikub/titanoboa 301-redirects to it, evidencing the
    repository transfer). Titanoboa is independently branded at titanoboa.io, was
    authored by Miro Kubicek, and is published to Clojars under the personal account
    "miro" — so `official: false` for Commsor. Recorded here because they are real,
    dated, publicly-published artifacts hosted under this company's GitHub org, and
    because their release dates are the only provider-adjacent decay evidence
    available: every one of them last shipped in 2018-2019.
  packages:
  - language: clojure
    registry: clojars
    name: titanoboa/titanoboa
    url: https://clojars.org/titanoboa
    install: '[titanoboa "0.7.1"]'
    version: 0.7.1
    published: '2018-11-22'
    license: AGPL-3.0
    official: false
    note: >-
      Clojars metadata lastUpdated 20181122210420. The GitHub repository kept
      releasing past this point (tags to 1.0.0-alfa.1, 2021-02-04) — the registry
      artifact is four releases behind the source, so a consumer resolving from
      Clojars gets 0.7.1, not the newest code.
